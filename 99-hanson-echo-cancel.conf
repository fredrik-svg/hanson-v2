# PipeWire echo-cancellation för Hanson v3
# Skapar en virtuell mikrofon ("hanson_echo_cancelled_mic") som är
# ReSpeaker-mikrofonen MINUS Waveshare-högtalarens ljud, beräknat i
# realtid med WebRTC:s AEC-motor.
#
# Detta löser ekot mellan två SEPARATA USB-enheter — något ReSpeakerns
# inbyggda hårdvaru-AEC inte kan göra eftersom den bara känner till sin
# egen utgång, inte Waveshare-kortets.
#
# Placeras i: ~/.config/pipewire/pipewire.conf.d/
# (skapa katalogen om den inte finns)

context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            # Mikrofonen som ska rensas från eko (capture-källa)
            capture.props = {
                node.name = "hanson_ec_capture"
                node.target = "alsa_input.usb-SEEED_ReSpeaker_4_Mic_Array__UAC1.0_-00.analog-surround-21"
            }
            # Högtalaren vars ljud ska cancelleras bort (referenssignal)
            playback.props = {
                node.name = "hanson_ec_playback"
                node.target = "alsa_output.usb-Solid_State_System_Co._Ltd._USB_PnP_Audio_Device_000000000000-00.analog-stereo"
            }
            # Den VIRTUELLA mikrofon agenten ska lyssna på (eko-rensad)
            source.props = {
                node.name = "hanson_echo_cancelled_mic"
                node.description = "Hanson Echo-Cancelled Mic"
            }
            # Den VIRTUELLA högtalare agenten ska spela TILL
            # (ljudet skickas vidare till Waveshare OCH används som AEC-referens)
            sink.props = {
                node.name = "hanson_echo_cancelled_speaker"
                node.description = "Hanson Echo-Cancelled Speaker"
            }
            aec.args = {
                # WebRTC AEC-inställningar
                webrtc.gain_control = true
                webrtc.noise_suppression = true
                webrtc.extended_filter = true
                webrtc.high_pass_filter = true
            }
        }
    }
]
