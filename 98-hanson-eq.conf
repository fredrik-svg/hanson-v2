# PipeWire filter-chain EQ för Hanson v3 — "fyllig röst"-kurva
#
# Använder den inbyggda param_eq-labeln (beprövad PipeWire-syntax) som
# kedjar biquad-filter internt. Motverkar tunt/burkigt röstljud genom att
# lyfta bas/kropp och tämja det burkiga mellanregistret.
#
# Skapar en virtuell sink "hanson_eq". Ljud spelat dit filtreras och skickas
# vidare till echo-cancel-sinken (hanson_echo_cancelled_speaker) → Waveshare.
#
# SÄKER DESIGN: rent filter i PipeWire-grafen, inga konkurrerande default-
# enheter, rör inte routing/volym. Avaktivera: ta bort filen + starta om
# PipeWire (systemctl --user restart pipewire). Inga rester.
#
# Placeras i: ~/.config/pipewire/pipewire.conf.d/
#
# EQ-kurva (ändra gain-värdena för att smaksätta, starta om PipeWire efteråt):
#   80 Hz   +5 dB  low shelf  — fyllig bas/värme
#   180 Hz  +3 dB  peaking    — kropp
#   1500 Hz -3 dB  peaking    — dämpa "burkighet"/telefonljud
#   3500 Hz +2 dB  peaking    — närvaro/tydlighet
#   8000 Hz +2 dB  high shelf — luft/klarhet

context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Hanson Voice EQ"
            media.name       = "Hanson Voice EQ"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq
                        label = param_eq
                        config = {
                            filters = [
                                { type = bq_lowshelf,  freq = 80,   gain = 5.0,  q = 0.7 }
                                { type = bq_peaking,   freq = 180,  gain = 3.0,  q = 1.0 }
                                { type = bq_peaking,   freq = 1500, gain = -3.0, q = 1.2 }
                                { type = bq_peaking,   freq = 3500, gain = 2.0,  q = 1.0 }
                                { type = bq_highshelf, freq = 8000, gain = 2.0,  q = 0.7 }
                            ]
                        }
                    }
                ]
                links = []
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "hanson_eq"
                node.description  = "Hanson Voice EQ"
                media.class       = Audio/Sink
            }
            playback.props = {
                node.name        = "hanson_eq_output"
                node.passive      = true
                node.target       = "hanson_echo_cancelled_speaker"
            }
        }
    }
]
