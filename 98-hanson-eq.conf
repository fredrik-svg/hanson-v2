# PipeWire filter-chain EQ för Hanson v3 — "fyllig röst"-kurva
#
# Lägger en parametrisk equalizer mellan ElevenLabs-ljudet och högtalaren
# för att motverka det tunna/burkiga ljudet (WebRTC AEC arbetar internt i
# 16kHz vilket klipper diskant; denna EQ lyfter bas/kropp och tämjer det
# burkiga mellanregistret för en varmare, fylligare röst).
#
# Skapar en virtuell sink "hanson_eq" som ljudet kan spelas till. Den
# filtrerade signalen skickas vidare till echo-cancel-sinken.
#
# SÄKER DESIGN: detta är ett rent filter inuti PipeWire-grafen. Det skapar
# INGA konkurrerande default-enheter och rör INTE routing eller volym på
# befintliga enheter. För att avaktivera: ta bort denna fil och starta om
# PipeWire (systemctl --user restart pipewire). Inga rester.
#
# Placeras i: ~/.config/pipewire/pipewire.conf.d/
#
# EQ-kurva (justera "Gain"-värdena för att smaksätta):
#   80 Hz   +5 dB  (low shelf)  — fyllig bas/värme
#   180 Hz  +3 dB  (peaking)    — kropp
#   500 Hz   0 dB  (peaking)    — neutral referens
#   1500 Hz -3 dB  (peaking)    — dämpa "burkighet"/telefonljud
#   3500 Hz +2 dB  (peaking)    — närvaro/tydlighet
#   8000 Hz +2 dB  (high shelf) — luft/klarhet (begränsad nytta pga AEC)

context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            node.description = "Hanson Voice EQ"
            media.name       = "Hanson Voice EQ"
            filter.graph = {
                nodes = [
                    {
                        type  = builtin
                        name  = eq_band_1
                        label = bq_lowshelf
                        control = { "Freq" = 80   "Q" = 0.7 "Gain" = 5.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_2
                        label = bq_peaking
                        control = { "Freq" = 180  "Q" = 1.0 "Gain" = 3.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_3
                        label = bq_peaking
                        control = { "Freq" = 500  "Q" = 1.0 "Gain" = 0.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_4
                        label = bq_peaking
                        control = { "Freq" = 1500 "Q" = 1.2 "Gain" = -3.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_5
                        label = bq_peaking
                        control = { "Freq" = 3500 "Q" = 1.0 "Gain" = 2.0 }
                    }
                    {
                        type  = builtin
                        name  = eq_band_6
                        label = bq_highshelf
                        control = { "Freq" = 8000 "Q" = 0.7 "Gain" = 2.0 }
                    }
                ]
                links = [
                    { output = "eq_band_1:Out" input = "eq_band_2:In" }
                    { output = "eq_band_2:Out" input = "eq_band_3:In" }
                    { output = "eq_band_3:Out" input = "eq_band_4:In" }
                    { output = "eq_band_4:Out" input = "eq_band_5:In" }
                    { output = "eq_band_5:Out" input = "eq_band_6:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "hanson_eq"
                node.description  = "Hanson Voice EQ"
                media.class       = Audio/Sink
            }
            playback.props = {
                node.name        = "hanson_eq_output"
                node.passive      = true
                # Skicka den filtrerade signalen vidare till echo-cancel-sinken
                node.target       = "hanson_echo_cancelled_speaker"
            }
        }
    }
]
